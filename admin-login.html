<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تسجيل دخول المسؤول - SMC</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="brand">
      <img class="logo" src="assets/logo.jpg" alt="شعار النادي" style="width:100px;height:100px;">
      <h1>تسجيل دخول المسؤول</h1>
      <p class="sub">S . M . C</p>
    </div>

    <div class="card">
      <div id="msgBox"></div>
      <form id="loginForm">
        <label>رمز العضوية</label>
        <input type="text" id="code" autocomplete="username" placeholder="SMC-000001-A">
        <label>كلمة السر</label>
        <input type="password" id="password" autocomplete="current-password">
        <div style="margin-top:10px;">
          <a href="#" class="link" id="forgotLink">هل نسيت كلمة السر؟</a>
        </div>
        <button type="submit" class="btn" style="margin-top:20px;">دخول</button>
      </form>
      <a href="index.html" class="link">&larr; رجوع للصفحة الرئيسية</a>
    </div>
  </div>

  <div class="modal-overlay" id="forgotModal" style="display:none;">
    <div class="modal">
      <h3>نسيت كلمة السر؟</h3>
      <div id="forgotBody">
        <p style="color:#ccc;font-size:.9rem;">سيتم إرسال إشعار إلى المسؤولين لمساعدتك في استعادة كلمة السر.</p>
      </div>
      <div class="grid-actions">
        <button class="btn danger" id="forgotSend">إرسال</button>
        <button class="btn secondary" id="forgotCancel">رجوع</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
  <script>initLoginPage("admin", "تسجيل دخول المسؤول", "admin.html");</script>
</body>
</html>
