<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>SMC Database</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, background: #000; color: #FFF; }
    .logo { width: 120px; opacity: 0.05; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; background: #111; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <img src="logo.png" class="logo">
  
  <div id="login-container">
    <h1>نادي الرجال السري (SMC)</h1>
    <input type="text" id="membership_code" placeholder="رمز العضوية" style="font-family: Arial;">
    <input type="password" id="password" placeholder="كلمة السر" style="font-family: Arial;">
    <button onclick="login()">تسجيل الدخول</button>
    <p id="error" style="color: red;"></p>
  </div>

  <div id="dashboard" class="hidden">
    <h2 id="welcome"></h2>
    <button onclick="logout()">تسجيل خروج</button>
    <div id="actions"></div>
    <div id="table-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
