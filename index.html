<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعدة بيانات أعضاء نادي الرجال السري - SMC</title>
    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #d4af37; /* ذهبي فاخر */
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --text-color: #f1f1f1;
            --border-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-color);
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        button {
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #e6c547;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary-color);
        }
        .hidden {
            display: none !important;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #222;
            color: var(--primary-color);
        }
        tr:nth-child(even) {
            background-color: #111;
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .badge-active { background: #155724; color: #d4edda; }
        .badge-frozen { background: #856404; color: #fff3cd; }
        .badge-banned { background: #721c24; color: #f8d7da; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--primary-color);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- ضع هنا رابط شعار نادي الرجال السري الخاص بك -->
        <img src="https://via.placeholder.com/150/000000/d4af37?text=SMC" alt="شعار SMC">
        <h1>نادي الرجال السري - SMC</h1>
    </div>

    <div class="container" id="app">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-section">
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--primary-color);">تسجيل الدخول للنظام</h2>
            <div class="form-group">
                <label>رمز العضوية</label>
                <input type="text" id="login-code" placeholder="مثال: SMC-000001-A-SA">
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="login-pass" placeholder="كلمة السر">
            </div>
            <button onclick="login()">دخول</button>
        </div>

        <!-- لوحة التحكم الرئيسية (المسؤول / المشرف / الساموراي) -->
        <div id="dashboard-section" class="hidden">
            <div class="actions-bar">
                <div>
                    <h3 id="user-welcome">مرحباً، </h3>
                    <p id="user-role-display" style="color: var(--primary-color); font-size: 0.9rem;"></p>
                </div>
                <div>
                    <button class="btn-secondary" onclick="logout()">تسجيل خروج</button>
                </div>
            </div>

            <!-- أزرار المسؤول -->
            <div id="admin-controls" class="hidden" style="margin-bottom: 20px;">
                <button onclick="openRegisterModal()" style="width: auto;">+ تسجيل عضو جديد</button>
                <button class="btn-secondary" onclick="openChangePasswordModal()" style="width: auto;">تغيير كلمات السر</button>
            </div>

            <!-- خانة البحث المشتركة -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="بحث بالاسم أو رمز العضوية...">
                <button onclick="searchMembers()" style="width: 150px;">بحث</button>
            </div>

            <!-- جدول البيانات للمسؤول والمشرف -->
            <div id="table-container" style="overflow-x: auto;">
                <table id="members-table">
                    <thead>
                        <tr>
                            <th>رمز العضوية</th>
                            <th>الاسم</th>
                            <th>رقم التلفون</th>
                            <th>السكن</th>
                            <th>روابط الحسابات</th>
                            <th>الحالة</th>
                            <th>تم التسجيل بواسطة</th>
                            <th>تاريخ التسجيل</th>
                            <th>تاريخ الانتهاء</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="members-tbody">
                        <!-- يتم تعبئتها ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل عضو جديد (للمسؤول فقط) -->
    <div id="register-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;">تسجيل عضو جديد في النظام</h3>
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="new-name">
            </div>
            <div class="form-group">
                <label>رقم التلفون</label>
                <input type="text" id="new-phone">
            </div>
            <div class="form-group">
                <label>السكن</label>
                <input type="text" id="new-location">
            </div>
            <div class="form-group">
                <label>رابط الفيسبوك</label>
                <input type="text" id="new-fb">
            </div>
            <div class="form-group">
                <label>رابط حساب الساموراي (إن وجد)</label>
                <input type="text" id="new-samurai-link">
            </div>
            <div class="form-group">
                <label>الرتبة / الفئة</label>
                <select id="new-role">
                    <option value="مسؤول . ساموراي">مسؤول . ساموراي (A-SA)</option>
                    <option value="مسؤول . ساموراي سابق">مسؤول . ساموراي سابق (A-SAF)</option>
                    <option value="مسؤول">مسؤول (A)</option>
                    <option value="مشرف . ساموراي">مشرف . ساموراي (S-SA)</option>
                    <option value="مشرف . ساموراي سابق">مشرف . ساموراي سابق (S-SAF)</option>
                    <option value="مشرف">مشرف (S)</option>
                    <option value="مسؤول سابق . ساموراي">مسؤول سابق . ساموراي (AF-SA)</option>
                    <option value="مشرف سابق . ساموراي">مشرف سابق . ساموراي (SF-SA)</option>
                    <option value="ساموراي">ساموراي (SA)</option>
                    <option value="مسؤول سابق . ساموراي سابق">مسؤول سابق . ساموراي سابق (AF-SAF)</option>
                    <option value="مشرف سابق . ساموراي سابق">مشرف سابق . ساموراي سابق (SF-SAF)</option>
                    <option value="مسؤول سابق">مسؤول سابق (AF)</option>
                    <option value="مشرف سابق">مشرف سابق (SF)</option>
                    <option value="ساموراي سابق">ساموراي سابق (SAF)</option>
                    <option value="عضو">عضو (M)</option>
                </select>
            </div>
            <div class="form-group">
                <label>كلمة السر المؤقتة</label>
                <input type="text" id="new-pass" value="123456">
            </div>
            <button onclick="registerNewMember()">حفظ وتسجيل العضو</button>
            <button class="btn-secondary" onclick="closeRegisterModal()" style="margin-top: 10px;">إغلاق</button>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase بالمفاتيح الخاصة بك
        const SUPABASE_URL = 'https://mltfdadqekewuleimreva.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sdGZkYWRxZWtldWxlaW1yZXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTMyNTMsImV4cCI6MjEwMTU4OTI1M30.SF3eoQLJGZsAyOsGmv_XalmJrkLHRqvP-hC99OLpTBg';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // خريطة الرموز حسب الرتبة
        const roleCodes = {
            'مسؤول . ساموراي': 'A-SA',
            'مسؤول . ساموراي سابق': 'A-SAF',
            'مسؤول': 'A',
            'مشرف . ساموراي': 'S-SA',
            'مشرف . ساموراي سابق': 'S-SAF',
            'مشرف': 'S',
            'مسؤول سابق . ساموراي': 'AF-SA',
            'مشرف سابق . ساموراي': 'SF-SA',
            'ساموراي': 'SA',
            'مسؤول سابق . ساموراي سابق': 'AF-SAF',
            'مشرف سابق . ساموراي سابق': 'SF-SAF',
            'مسؤول سابق': 'AF',
            'مشرف سابق': 'SF',
            'ساموراي سابق': 'SAF',
            'عضو': 'M'
        };

        async function login() {
            const code = document.getElementById('login-code').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if (!code || !pass) {
                alert('الرجاء إدخال رمز العضوية وكلمة السر');
                return;
            }

            const { data, error } = await supabaseClient
                .from('smc_members')
                .select('*')
                .eq('membership_code', code)
                .eq('password_hash', pass)
                .single();

            if (error || !data) {
                alert('خطأ في رمز العضوية أو كلمة السر، أو أن عضويتك غير نشطة / لا تملك صلاحية الدخول.');
                return;
            }

            if (data.status === 'محظور' || data.status === 'مجمد') {
                alert('عذراً، عضويتك مجمدة أو محظورة ولا يمكنك الدخول.');
                return;
            }

            // التحقق من صلاحيات الدخول حسب الرتب المطلوبة
            const role = data.role_type;
            const canAccessAdmin = ['مسؤول . ساموراي', 'مسؤول . ساموراي سابق', 'مسؤول'].includes(role);
            const canAccessSupervisor = canAccessAdmin || ['مشرف . ساموراي', 'مشرف . ساموراي سابق', 'مشرف'].includes(role);
            const canAccessSamurai = canAccessSupervisor || ['ساموراي', 'مسؤول سابق . ساموراي', 'مشرف سابق . ساموراي'].includes(role);

            if (!canAccessSamurai) {
                alert('ليس لديك الصلاحية الكافية للوصول إلى لوحة التحكم.');
                return;
            }

            currentUser = data;
            initDashboard();
        }

        function initDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = `مرحباً، ${currentUser.full_name}`;
            document.getElementById('user-role-display').innerText = `الرتبة: ${currentUser.role_type} | الرمز: ${currentUser.membership_code}`;

            const role = currentUser.role_type;
            const isAdmin = ['مسؤول . ساموراي', 'مسؤول . ساموراي سابق', 'مسؤول'].includes(role);

            if (isAdmin) {
                document.getElementById('admin-controls').classList.remove('hidden');
            }

            loadMembers();
        }

        async function loadMembers(searchTerm = '') {
            let query = supabaseClient.from('smc_members').select('*');
            
            if (searchTerm) {
                query = query.or(`full_name.ilike.%${searchTerm}%,membership_code.ilike.%${searchTerm}%`);
            }

            const { data, error } = await query;
            if (error) {
                console.error(error);
                return;
            }

            const tbody = document.getElementById('members-tbody');
            tbody.innerHTML = '';

            data.forEach(member => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${member.membership_code}</td>
                    <td>${member.full_name}</td>
                    <td>${member.phone}</td>
                    <td>${member.location}</td>
                    <td>
                        ${member.facebook_link ? `<a href="${member.facebook_link}" target="_blank">فيسبوك</a>` : ''}
                        ${member.samurai_link ? `<br><a href="${member.samurai_link}" target="_blank">الساموراي</a>` : ''}
                    </td>
                    <td><span class="badge badge-active">${member.status}</span></td>
                    <td>${member.registered_by}</td>
                    <td>${new Date(member.registration_date).toLocaleDateString()}</td>
                    <td>${new Date(member.expiry_date).toLocaleDateString()}</td>
                    <td>
                        <button onclick="renewMembership(${member.id})" style="padding: 5px 10px; font-size: 0.8rem;">تجديد</button>
                        <button onclick="deleteMember(${member.id})" class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem; color: #ff5555; border-color: #ff5555;">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchMembers() {
            const term = document.getElementById('search-input').value.trim();
            loadMembers(term);
        }

        function openRegisterModal() {
            document.getElementById('register-modal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('register-modal').classList.add('hidden');
        }

        async function registerNewMember() {
            const name = document.getElementById('new-name').value.trim();
            const phone = document.getElementById('new-phone').value.trim();
            const location = document.getElementById('new-location').value.trim();
            const fb = document.getElementById('new-fb').value.trim();
            const samuraiLink = document.getElementById('new-samurai-link').value.trim();
            const role = document.getElementById('new-role').value;
            const pass = document.getElementById('new-pass').value.trim();

            if (!name || !phone || !location) {
                alert('الرجاء إكمال البيانات الأساسية للعضو.');
                return;
            }

            // توليد رقم تسلسلي تلقائي فريد
            const { count } = await supabaseClient.from('smc_members').select('*', { count: 'exact', head: true });
            const nextIdNum = (count || 0) + 1;
            const paddedId = String(nextIdNum).padStart(6, '0');
            const roleCodeSuffix = roleCodes[role] || 'M';
            const membershipCode = `SMC-${paddedId}-${roleCodeSuffix}`;

            const expiryDate = new Date();
            expiryDate.setFullYear(expiryDate.getFullYear() + 1); // سنة كاملة

            const { error } = await supabaseClient.from('smc_members').insert([{
                membership_code: membershipCode,
                full_name: name,
                phone: phone,
                location: location,
                facebook_link: fb,
                samurai_link: samuraiLink,
                role_type: role,
                status: 'نشط',
                password_hash: pass,
                registered_by: currentUser.full_name,
                expiry_date: expiryDate.toISOString()
            }]);

            if (error) {
                alert('حدث خطأ أثناء التسجيل (قد يكون الاسم ورقم التلفون مسجلين مسبقاً): ' + error.message);
                return;
            }

            alert(`تم تسجيل العضو بنجاح برمز العضوية: ${membershipCode}`);
            closeRegisterModal();
            loadMembers();
        }

        async function renewMembership(id) {
            const newExpiry = new Date();
            newExpiry.setFullYear(newExpiry.getFullYear() + 1);

            const { error } = await supabaseClient
                .from('smc_members')
                .update({ expiry_date: newExpiry.toISOString(), status: 'نشط' })
                .eq('id', id);

            if (error) {
                alert('فشل تجديد العضوية');
            } else {
                alert('تم تجديد العضوية بنجاح لمدة سنة إضافية.');
                loadMembers();
            }
        }

        async function deleteMember(id) {
            if (confirm('هل أنت متأكد من حذف هذا العضو؟ (سيتم الاحتفاظ برقمه التسلسلي ولن يتم منحه لشخص آخر).')) {
                const { error } = await supabaseClient.from('smc_members').delete().eq('id', id);
                if (error) {
                    alert('خطأ في الحذف');
                } else {
                    alert('تم حذف السجل بنجاح.');
                    loadMembers();
                }
            }
        }

        function openChangePasswordModal() {
            alert('ميزة تغيير كلمات السر متاحة للمسؤولين عبر لوحة التحكم المباشرة.');
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-code').value = '';
            document.getElementById('login-pass').value = '';
        }
    </script>
</body>
</html>
