<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نادي الرجال السري - SMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --red:#c81d25; --red-bright:#e2222b; --black:#0a0a0a; --panel:#141414;
    --panel2:#1b1b1b; --gold:#c9a227; --white:#f2efe9; --muted:#9a9a9a;
    --border: #2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(200,29,37,0.10), transparent 60%);
    position:relative;
  }
  .container {
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  h2, h3 { color: var(--gold); text-align: center; }
  input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--white);
    border-radius: 5px;
    font-family: 'Tajawal',sans-serif;
  }
  button {
    width: 100%;
    padding: 10px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Tajawal',sans-serif;
    transition: 0.3s;
  }
  button:hover { background: var(--red-bright); }
  .hidden { display: none !important; }
  .error { color: var(--red-bright); text-align: center; font-size: 14px; }
  .success { color: #2ecc71; text-align: center; font-size: 14px; }
</style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-screen" class="container">
    <h2>نادي الرجال السري - SMC</h2>
    <p style="text-align:center; color:var(--muted);">يرجى تسجيل الدخول برمز العضوية وكلمة السر</p>
    <input type="text" id="login-membership" placeholder="رمز العضوية (مثال: SMC-000001-A-SA)" value="SMC-000001-A-SA">
    <input type="password" id="login-password" placeholder="كلمة السر" value="123456">
    <button onclick="handleLogin()">دخول</button>
    <p id="login-msg" class="error"></p>
  </div>

  <!-- الشاشة الرئيسية للبرنامج (تظهر بعد تسجيل الدخول) -->
  <div id="app-screen" class="container hidden" style="max-width: 600px;">
    <h2>لوحة تحكم العضو</h2>
    <div id="user-info" style="background:var(--panel2); padding:15px; border-radius:5px; margin-bottom:15px;">
      <!-- سيتم تعبئة البيانات هنا تلقائياً من قاعدة البيانات -->
    </div>

    <h3>تغيير كلمة السر</h3>
    <input type="password" id="new-password" placeholder="كلمة السر الجديدة">
    <button onclick="handleChangePassword()">حفظ كلمة السر الجديدة</button>
    <p id="pass-msg" class="success"></p>

    <button onclick="handleLogout()" style="background:var(--border); margin-top:20px;">تسجيل خروج</button>
  </div>

<script>
  // إعدادات اتصال Supabase (قم بوضع بيانات مشروعك هنا)
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  async function handleLogin() {
    const membership = document.getElementById('login-membership').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const msgEl = document.getElementById('login-msg');

    msgEl.textContent = 'جاري التحقق...';

    // البحث عن العضو في جدول قاعدة البيانات (مثال فرضنا اسم الجدول members والحقول membership_code و password)
    const { data, error } = await supabase
      .from('members')
      .select('*')
      .eq('membership_code', membership)
      .eq('password', password)
      .single();

    if (error || !data) {
      msgEl.textContent = 'رمز العضوية أو كلمة السر غير صحيحة!';
    } else {
      currentUser = data;
      msgEl.textContent = '';
      showAppScreen();
    }
  }

  function showAppScreen() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');

    // عرض بيانات العضو المستخرجة من قاعدة البيانات
    const infoDiv = document.getElementById('user-info');
    infoDiv.innerHTML = `
      <p><strong>الاسم:</strong> ${currentUser.full_name || 'أحمد حامد'}</p>
      <p><strong>رمز العضوية:</strong> ${currentUser.membership_code}</p>
      <p><strong>الرتبة/المنصب:</strong> ${currentUser.role || 'عضو مؤسس'}</p>
    `;
  }

  async function handleChangePassword() {
    const newPass = document.getElementById('new-password').value.trim();
    const passMsg = document.getElementById('pass-msg');
    
    if(!newPass || newPass.length < 6) {
      passMsg.className = 'error';
      passMsg.textContent = 'يجب أن تكون كلمة السر الجديدة 6 أحرف أو أرقام على الأقل.';
      return;
    }

    // تحديث كلمة السر في قاعدة البيانات لـ Supabase
    const { error } = await supabase
      .from('members')
      .update({ password: newPass })
      .eq('id', currentUser.id);

    if (error) {
      passMsg.className = 'error';
      passMsg.textContent = 'حدث خطأ أثناء تحديث كلمة السر.';
    } else {
      passMsg.className = 'success';
      passMsg.textContent = 'تم تغيير كلمة السر بنجاح!';
      document.getElementById('new-password').value = '';
    }
  }

  function handleLogout() {
    currentUser = null;
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-password').value = '';
  }
</script>
</body>
</html>
