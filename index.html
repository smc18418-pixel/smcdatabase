<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نادي الرجال السري - SMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --red:#c81d25; --red-bright:#e2222b; --black:#0a0a0a; --panel:#141414;
    --panel2:#1b1b1b; --gold:#c9a227; --white:#f2efe9; --muted:#9a9a9a;
    --border: #2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(200,29,37,0.10), transparent 60%);
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAHrCAIAAAC2NPiTAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+viUYcLcKakFicD6Q9ArFIEtBxopAiQLZIOYWuA2EkQtg2IXV5SUAJkB4DYRSFBzkB2CpCtkY7ETkJiJxcUgdT3ANk2uTmlyQh3M/Ck5oUGA2kOIJZhKGYIYnBncAL5H6IkfxEDg8VXBgbmCQixpJkMDNtbGRgkbiHEVBYwMPC3MDBsO48QQ4RJQWJRIliIBYiZ0tIYGD4tZ2DgjWRgEL7AwMAVDQsIHG5TALvNnSEfCNMZchhSgSKeDHkMyQx6QJYRgwGDIYMZAKbWPz9HbOBQAAEAAElEQVR42uz92ZIkS5YkiDEfEVFVM/PdY797ZtZUU3UPeobwNHgA8AsgJVHJQSGKkZ2j251296x3Zza8aWqO2uI3kYw1YyU2k5M9b9y25uVl89M2N15352c3NTVa4eR8vNzFSUiYkQQmICiBCSECEZgSAzMzMzi1gDImS2yF11N+1sP9y6d6dzn3tnZs4gO1U9uY686j8Bq9mZ0RERJgwoScmTPi/wM2hR4oU+X/B5Qj/hN0mC7T0g4j6Z42wAAABJRU5ErkJggg==');
    opacity: 0.03;
    pointer-events: none;
  }
  .container {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  h2 {
    text-align: center;
    color: var(--gold);
    margin-bottom: 25px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--white);
    border-radius: 4px;
    font-family: 'Tajawal', sans-serif;
  }
  input:focus {
    border-color: var(--gold);
    outline: none;
  }
  button {
    width: 100%;
    padding: 12px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    transition: background 0.3s;
  }
  button:hover {
    background: var(--red-bright);
    color: var(--white);
  }
  #error-msg {
    color: var(--red-bright);
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>نادي الرجال السري</h2>
  <form id="login-form">
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" id="login-btn">تسجيل الدخول</button>
    <div id="error-msg"></div>
  </form>
</div>

<script>
  // ضع بيانات مشغلك هنا (Supabase URL & Anon Key)
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('error-msg');
    errorDiv.textContent = 'جاري تسجيل الدخول...';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) throw error;

      errorDiv.style.color = 'var(--gold)';
      errorDiv.textContent = 'تم تسجيل الدخول بنجاح! جاري التحويل...';
      setTimeout(() => {
        window.location.href = 'dashboard.html'; // أو الصفحة الرئيسية لديك
      }, 1000);

    } catch (err) {
      errorDiv.style.color = 'var(--red-bright)';
      errorDiv.textContent = 'خطأ في البريد أو كلمة المرور، يرجى المحاولة مرة أخرى.';
    }
  });
</script>
</body>
</html>
